# S01E01 plot beats — 剧情分段台词数据源
# 用法：build-modern-family-s01-daily-lines.py --episode 1
# 每段 ≤15 句；完整对白优先；残句不收录

episode: 1
title_en: "Pilot — three households"
beats:
  - id: a
    title: "A. 机场回程与清晨开场"
    scene_note: "邓菲家叫吃早饭；楼上楼下喊话；赴宴时间。"
    lines:
      - en: "Stop the car. - Oh, where are you going?"
        zh: "停车。——你去哪儿？"
      - en: "She barely slept on the plane and she's still wide awake."
        zh: "她在飞机上几乎没睡，现在却还精神抖擞。"
      - en: "Even Pepper pointed it out on the way home from the airport."
        zh: "从机场回家的路上，连 Pepper 都看出来她没困。"
      - en: "Kids, breakfast!"
        zh: "孩子们，吃早饭了！"
      - en: "Why are you guys yelling at us when we're way upstairs?"
        zh: "我们在楼上老远，你们喊也没用啊。"
      - en: "And then- Oh, we gotta leave for that dinner thing at 5:00."
        zh: "然后——哦，我们五点还得去赴宴。"
      - en: "Kids? Get down here!"
        zh: "孩子们？快下来！"
      - en: "Phil, would you get them?"
        zh: "菲尔，把他们叫下来好吗？"
      - en: "Just text me. - All right. That's not gonna happen."
        zh: "发短信告诉我。——那不可能。"

  - id: b
    title: "B. Haley 短裙与 Phil「酷爸」"
    scene_note: "Claire 要 Phil 管裙子；Phil 嘴上说可爱、实则和稀泥。"
    lines:
      - en: "Honey, do you have anything to say to your daughter about her skirt? - Sorry."
        zh: "亲爱的，对你女儿这条裙子有什么要说的吗？——不好意思。"
      - en: "Oh, yeah. That looks really cute, sweetheart. - Thanks."
        zh: "哦对，挺可爱的，宝贝。——谢谢。"
      - en: "And, wow! You're not wearing that outfit."
        zh: "哇，你不能穿这套出门。"
      - en: "What's wrong with it?"
        zh: "这衣服怎么了？"
      - en: "No. It's way too short."
        zh: "不行，太短了。"
      - en: "People know you're a girl."
        zh: "大家都知道你是女孩子。"
      - en: "You don't need to prove it to them."
        zh: "没必要穿成这样给他们看。"
      - en: "Let's take it down a notch."
        zh: "小声点。"

  - id: c
    title: "C. Claire 的成长史与育儿底线"
    scene_note: "Phil 旁白式坦白；Florida 底线梗；家法「射卢克」与 follow through。"
    lines:
      - en: "I just don't want my kids to make the same bad mistakes I made"
        zh: "我只是不想让孩子重蹈我当年的覆辙。"
      - en: "I was out of control growing up."
        zh: "我青春期简直无法无天。"
      - en: "There, you know? I said it."
        zh: "看吧，我坦白了。"
      - en: "I-If Haley never wakes up on a beach in Florida, half-naked,"
        zh: "只要海莉别半裸着在佛罗里达沙滩上醒来，"
      - en: "Our job. - Right."
        zh: "咱俩的任务。——对。"
      - en: "I've done our job."
        zh: "我就算完成了咱俩的任务。"
      - en: "\"Shoot Luke.\" - Sorry, dude. It's on the calendar."
        zh: "「射卢克。」——抱歉老弟，日程表上写着呢。"
      - en: "And now you have to follow through."
        zh: "所以你现在得按说好的执行。"
      - en: "Redheaded dad is angry daddy. - No, I'm not."
        zh: "红发老爹是怒火老爹。——我才不是。"
      - en: "you don't have to be so emotional all the time.That's all I'm saying."
        zh: "我只是说，你别老那么激动。"

  - id: d
    title: "D. Gloria 的身世与 Jay 家"
    scene_note: "哥伦比亚村庄黑色幽默；商场线 Jay 护 Gloria。"
    lines:
      - en: "We're very different."
        zh: "我俩太不一样了。"
      - en: "Jay's from the city."
        zh: "Jay 来自城市。"
      - en: "I come from a small village."
        zh: "我来自一个小村庄。"
      - en: "Very poor but very, very beautiful."
        zh: "很穷，但非常非常美。"
      - en: "It's the number one village in all Colombia for all the"
        zh: "我们村在全哥伦比亚……数量排第一，"
      - en: "What's the word?"
        zh: "那个词怎么说？"
      - en: "Murders."
        zh: "凶杀案。"
      - en: "Yes. The murders."
        zh: "对，凶杀案。"
      - en: "Hi, I'm Gloria Pritchett. Manny's mother."
        zh: "你好，我是 Gloria Pritchett，曼尼的妈妈。"
      - en: "Hey, watch it. - I wanna go to the mall where she works."
        zh: "嘿，说话注意点。——我要去她上班的商场。"

  - id: e
    title: "E. Manny 球场与 Jay 护短"
    scene_note: "Jay 场边咆哮；*take you out* 双关；误认丈夫。"
    lines:
      - en: "Vamos, Manny! Kick it! Kick it!"
        zh: "加油曼尼！踢啊！踢啊！"
      - en: "Manny, stop him!"
        zh: "曼尼，拦住他！"
      - en: "Damn it, Manny!"
        zh: "该死的，曼尼！"
      - en: "Come on, coach. You gotta take that kid out."
        zh: "教练，你得把那孩子换下去。"
      - en: "You wanna take him out? How about I take you out?"
        zh: "你想让他下场？不如我让你「下场」？"
      - en: "He spent the first half with his hand in his pants!"
        zh: "他上半场手一直插在裤裆里！"
      - en: "Actually, no, I'm her husband."
        zh: "其实不，我是她老公。"
      - en: "Don't be fooled by the, uh"
        zh: "别被外表骗了，呃——"
      - en: "Give me a second here."
        zh: "给我一点时间。"

  - id: f
    title: "F. Mitchell & Cam 领养 Lily"
    scene_note: "机上归国；代孕玩笑；晚宴演讲；cream puffs 双关。"
    lines:
      - en: "And, uh, we just- we decided we really wanted to have a baby."
        zh: "我们真的很想要一个孩子。"
      - en: "Who is a good girl? Who's that?"
        zh: "谁是乖宝宝呀？是谁呀？"
      - en: "Uh, we just, uh- We just adopted her from Vietnam."
        zh: "我们刚从越南领养了她。"
      - en: "And we're bringing her home for the first time, huh?"
        zh: "这是我们第一次带她回家，对吧？"
      - en: "She's an angel. You and your wife must be thrilled."
        zh: "她像小天使。你们一定很激动吧。"
      - en: "So, we had initially asked one of our lesbian friends to be a surrogate, but"
        zh: "起初我们想找一位女同性恋朋友代孕，但"
      - en: "Then we figured, they're already mean enough."
        zh: "后来想，她们平时就够刻薄了。"
      - en: "Look at that baby with those cream puffs. - Okay. Excuse me."
        zh: "你看那个宝宝和那些泡芙。——好了，失陪。"
      - en: "This baby would have grown up in a crowded orphanage"
        zh: "这宝宝原本可能在拥挤的孤儿院长大。"
      - en: "You saw that, right? Everybody fawning over Lily,"
        zh: "你看到了吧？大家都在围着 Lily，"
      - en: "Hear this. Love knows no race, creed"
        zh: "听好了，爱不分种族、信仰"
      - en: "Or gender."
        zh: "不分性别。"
      - en: "What? -She's got the cream puffs."
        zh: "干嘛？——人家说的是泡芙。"
      - en: "We would like to pay for everyone's headsets."
        zh: "各位的耳机费我们请了。"

  - id: g
    title: "G. Luke 卡栏杆与三娃冲突"
    scene_note: "banister 名场面；Manny 男生来访；BB 枪；*Deal with this* / *uncool*。"
    lines:
      - en: "Luke got his head stuck in the banister again."
        zh: "Luke 又把头卡在楼梯栏杆里了。"
      - en: "Buddy. Why do you keep getting stuck like this?"
        zh: "老弟，你怎么老卡在这儿？"
      - en: "I thought I could get out this time."
        zh: "我以为这次能拔出来。"
      - en: "I'm just gonna say it. He needs to be checked by a specialist."
        zh: "我直说了，他得找个专家查查（智商）。"
      - en: "There. Be free."
        zh: "好了，你自由了。"
      - en: "I'm having a friend over today. - Who?"
        zh: "今天有朋友来我家玩。——谁？"
      - en: "Ooh, a boy. You gonna kiss him?"
        zh: "哇，男生？你要亲他吗？"
      - en: "Fight in the sun. It'll be a nice change. - Haley."
        zh: "到太阳底下打。换换口味。——海莉。"
      - en: "Deal with this. - Buddy, uncool."
        zh: "你看着办。——老弟，这样不对。"
