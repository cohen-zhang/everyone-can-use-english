# 摩登家庭 S01 — 俚语/口头禅检测模式（供 build 脚本扫描 transcript）
# 每集只输出本集 transcript 中实际命中的表达

categories:
  catchphrase:
    label: "§A 高频口头禅"
    label_en: catchphrase
    items:
      - pattern: "(?i)\\bcome on\\b"
        head: "Come on!"
        ipa: "/kʌm ɑːn/"
        zh: "拜托；快点；别这样"
        usage: "催促、劝说、不信、抱怨"
        polite: "Give me a break. · Seriously?"
      - pattern: "(?i)\\bshut up\\b"
        head: "Shut up."
        ipa: "/ʃʌt ʌp/"
        zh: "闭嘴"
        usage: "直接、偏冒犯"
        polite: "Be quiet, please."
      - pattern: "(?i)\\bhang on\\b"
        head: "Hang on."
        ipa: "/hæŋ ɑːn/"
        zh: "等一下"
        usage: "口语稍等"
        polite: "Just a sec. · One moment."
      - pattern: "(?i)\\bhold on\\b"
        head: "Hold on."
        ipa: "/hoʊld ɑːn/"
        zh: "等一下"
        usage: "同 Hang on"
        polite: "Just a sec."
      - pattern: "(?i)what's up"
        head: "What's up?"
        ipa: "/wʌts ʌp/"
        zh: "怎么了；最近如何"
        usage: "打招呼或问发生什么事"
        polite: "How's it going?"
      - pattern: "(?i)\\bno way\\b"
        head: "No way."
        ipa: "/noʊ weɪ/"
        zh: "不可能；真的假的"
        usage: "拒绝或惊讶"
        polite: "Impossible. · You're kidding."
      - pattern: "(?i)are you kidding"
        head: "Are you kidding?"
        ipa: "/ɑːr ju ˈkɪdɪŋ/"
        zh: "你在开玩笑吗"
        usage: "震惊、不满"
        polite: "Seriously?"
      - pattern: "(?i)\\bmy bad\\b"
        head: "My bad."
        ipa: "/maɪ bæd/"
        zh: "我的错"
        usage: "轻量道歉"
        polite: "That's on me."
      - pattern: "(?i)\\bwhatever\\b"
        head: "Whatever."
        ipa: "/wətˈevər/"
        zh: "随便吧"
        usage: "无所谓或敷衍"
        polite: "I don't mind."

  slang_tone:
    label: "§B 俚语感"
    label_en: slang tone
    items:
      - pattern: "(?i)what the hell"
        head: "What the hell …?"
        ipa: "/wʌt ðə hel/"
        zh: "到底怎么回事"
        usage: "强烈惊讶/愤怒，偏粗"
        polite: "What on earth …?"
      - pattern: "(?i)\\bscrew it\\b"
        head: "Screw it."
        ipa: "/skru ɪt/"
        zh: "算了（带情绪）"
        usage: "放弃、不想继续"
        polite: "Forget it."
      - pattern: "(?i)\\bawesome\\b"
        head: "Awesome."
        ipa: "/əˈsɑːsəm/"
        zh: "太棒了"
        usage: "正向感叹"
        polite: "Great! · Fantastic!"
      - pattern: "(?i)\\blame\\b"
        head: "Lame."
        ipa: "/leɪm/"
        zh: "很土；无聊"
        usage: "评价没劲"
        polite: "That's weak."
      - pattern: "(?i)that sucks|sucks\\."
        head: "That sucks."
        ipa: "/ðæt sʌks/"
        zh: "太糟了"
        usage: "同情或吐槽"
        polite: "That's rough."
      - pattern: "(?i)freak out"
        head: "Freak out."
        ipa: "/friːk aʊt/"
        zh: "抓狂；慌了"
        usage: "情绪失控"
        polite: "Panic."
      - pattern: "(?i)big deal|no big deal"
        head: "Big deal. / No big deal."
        ipa: "/bɪɡ diːl/"
        zh: "有啥了不起 / 没什么大不了"
        usage: "反问或安抚"
        polite: "Don't make a fuss."
      - pattern: "(?i)damn it"
        head: "Damn it."
        ipa: "/dæm ɪt/"
        zh: "该死的（感叹）"
        usage: "沮丧、恼火"
        polite: "Oh no. · Darn it."

  meme_pragmatic:
    label: "§C 口头梗"
    label_en: meme / pragmatic bit
    items:
      - pattern: "(?i)deal with this"
        head: "Deal with this."
        ipa: "/diːl wɪð ðɪs/"
        zh: "你来处理；你看着办"
        usage: "把烂摊子交给对方；≠ Deal with it!"
        polite: "Handle this. · Take care of this."
      - pattern: "(?i)\\buncool\\b"
        head: "uncool"
        ipa: "/ʌnˈkuːl/"
        zh: "不酷；不得体"
        usage: "Phil 酷爸式社交评判"
        polite: "not cool · inappropriate"
      - pattern: "(?i)\\bbuddy\\b"
        head: "Buddy"
        ipa: "/ˈbʌdi/"
        zh: "老弟；伙计"
        usage: "亲昵称呼"
        polite: "dude · man"
      - pattern: "(?i)just a sec"
        head: "Just a sec."
        ipa: "/dʒʌst ə sek/"
        zh: "等一下"
        usage: "极短拖延"
        polite: "Hang on a second."
      - pattern: "(?i)watch it\\b|watch out"
        head: "watch it / Watch out!"
        ipa: "/wɑːtʃ ɪt/"
        zh: "注意点；小心"
        usage: "提醒言行或危险"
        polite: "Be careful."
      - pattern: "(?i)give me a second"
        head: "Give me a second."
        ipa: "/ɡɪv mi ə ˈsekənd/"
        zh: "给我一点时间"
        usage: "拖延、缓冲"
        polite: "Hold on a moment."
      - pattern: "(?i)nailed it"
        head: "Nailed it."
        ipa: "/neɪld ɪt/"
        zh: "搞定了；做得漂亮"
        usage: "成功、做准了"
        polite: "Perfect. · You crushed it."
      - pattern: "(?i)hands off|take your hands off"
        head: "Hands off!"
        ipa: "/hændz ɑːf/"
        zh: "别碰；别动"
        usage: "强烈边界"
        polite: "Please don't touch me."
